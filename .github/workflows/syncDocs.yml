name: Sync Express API to Docs Repo

on:
  push:
    branches:
      - main

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node: '20'

      - name: Install Dependencies
        run: npm install

      
        run: npm run generate-docs 

    
      - name: Push Spec to Docs Repo
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.DOCS_SYNC_TOKEN }}
        with:
          source_file: 'openapi.json' # The filename generated by your npm script
          destination_repo: 'somebody1011/docs'
          destination_folder: 'api-reference' # The folder in your docs repo
          user_email: 'action@github.com'
          user_name: 'GitHub Automated Action'
          commit_message: 'Automated update from finconnect Express routes'
